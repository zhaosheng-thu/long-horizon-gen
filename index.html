<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>长视频问题浏览器</title>
<meta name="description" content="Self-Forcing、LongLive 及其变体生成的 60 秒视频，配 VLM 盲评标注的时间轴浏览器。">
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f1; --surface: #fcfcfb; --surface2: #f0efec; --ink: #0b0b0b; --ink2: #52514e; --muted: #7a7974;
  --rule: #e2e1dc; --rule2: #ecebe7; --focus: #2a78d6;
  --m1: #2a78d6; --m2: #eb6834; --m3: #1baf7a; --m4: #eda100; --m5: #e87ba4; --m6: #008300; --m7: #6250d6;
  --red: #d03b3b; --blue: #2a78d6; --orange: #eb6834; --violet: #6250d6; --gray: #9b9a93; --green: #0ca30c;
  --f-body: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --f-data: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface2: #232321; --ink: #f0efec; --ink2: #c3c2b7; --muted: #8f8e86;
  --rule: #2f2f2c; --rule2: #262624; --focus: #3987e5;
  --m1: #3987e5; --m2: #d95926; --m3: #199e70; --m4: #c98500; --m5: #d55181; --m6: #008300; --m7: #9085e9;
  --red: #e05252; --blue: #3987e5; --orange: #d95926; --violet: #9085e9; --gray: #77766f; --green: #0ca30c; } }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface2: #232321; --ink: #f0efec; --ink2: #c3c2b7; --muted: #8f8e86;
  --rule: #2f2f2c; --rule2: #262624; --focus: #3987e5;
  --m1: #3987e5; --m2: #d95926; --m3: #199e70; --m4: #c98500; --m5: #d55181; --m6: #008300; --m7: #9085e9;
  --red: #e05252; --blue: #3987e5; --orange: #d95926; --violet: #9085e9; --gray: #77766f; --green: #0ca30c; }
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 var(--f-body) }
a { color: var(--focus) }
button, select, input { font: inherit; color: inherit }
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 16px 64px }
.mono, .num { font-family: var(--f-data); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) } .ink2 { color: var(--ink2) }
header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule) }
header.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; padding-bottom: 10px; flex-wrap: wrap }
@media (max-width: 600px) { header.top { position: static } }
header.top h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .01em }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap }
nav.tabs a { text-decoration: none; color: var(--ink2); padding: 5px 11px; border-radius: 7px; font-weight: 500 }
nav.tabs a:hover { background: var(--surface2) }
nav.tabs a.on { background: var(--ink); color: var(--bg) }
.spacer { flex: 1 }
.btn { background: var(--surface); border: 1px solid var(--rule); border-radius: 7px; padding: 4px 10px; cursor: pointer; white-space: nowrap }
.btn:hover { border-color: var(--muted) }
.btn:focus-visible, select:focus-visible, input:focus-visible, .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 14px 0 10px }
.filters label { display: inline-flex; gap: 6px; align-items: center; color: var(--ink2) }
select, input[type=search] { background: var(--surface); border: 1px solid var(--rule); border-radius: 7px; padding: 4px 8px; max-width: 100% }
input[type=search] { width: 220px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 2px 10px 2px 8px; cursor: pointer; user-select: none; color: var(--ink2) }
.chip.off { opacity: .45 }
.chip .sw, .mchip .sw { width: 10px; height: 10px; border-radius: 3px; flex: none }
.mchip { display: inline-flex; align-items: center; gap: 6px; font-weight: 600 }
.count { color: var(--muted); margin-left: auto }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink2); font-size: 12.5px; padding: 4px 0 12px; align-items: center }
.legend .k { display: inline-flex; align-items: center; gap: 6px }
.legend .bar { width: 18px; height: 8px; border-radius: 2px; display: inline-block }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px; cursor: pointer; display: grid; gap: 7px; align-content: start; min-width: 0 }
.card:hover { border-color: var(--muted) }
.card .hd { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; min-width: 0 }
.card .hd .meta { color: var(--muted); margin-left: auto; white-space: nowrap }
.strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; border-radius: 6px; overflow: hidden }
.strip .fr { aspect-ratio: 96 / 55; background-repeat: no-repeat; background-color: var(--surface2); position: relative }
.strip .fr span { position: absolute; left: 3px; bottom: 1px; font: 10px var(--f-data); color: #fff; text-shadow: 0 0 3px #000 }
.prompt2 { font-size: 12.5px; color: var(--ink2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.badges { display: flex; flex-wrap: wrap; gap: 4px }
.bd { font-size: 11.5px; border-radius: 4px; padding: 0 6px; border: 1px solid var(--rule); color: var(--ink2); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px }
.bd i { width: 7px; height: 7px; border-radius: 2px; display: inline-block }
.more { display: flex; justify-content: center; padding: 18px }
svg.tl { display: block; width: 100%; overflow: visible }
svg.tl text { font-family: var(--f-body); fill: var(--ink2) }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.18); max-width: 330px; font-size: 12.5px; display: none }
.tip .thumb { width: 192px; height: 110px; background-repeat: no-repeat; border-radius: 4px; margin-bottom: 6px; background-color: var(--surface2) }
.tip .t { font: 600 13px var(--f-data) }
.tip ul { margin: 4px 0 0; padding-left: 16px }
.tip li { margin: 2px 0 }
section.view { display: none } section.view.on { display: block }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px }
.detail-top { display: grid; grid-template-columns: minmax(0, 640px) minmax(0, 1fr); gap: 16px; padding-top: 14px }
@media (max-width: 900px) { .detail-top { grid-template-columns: 1fr } }
video { width: 100%; border-radius: 8px; background: #000; display: block; aspect-ratio: 416 / 240 }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px }
.kv dt { color: var(--muted) } .kv dd { margin: 0 }
h2 { font-size: 16px; margin: 22px 0 10px } h3 { font-size: 14px; margin: 0 0 6px }
.navrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-top: 14px }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px }
table { border-collapse: collapse; width: 100%; font-size: 13px }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--rule2); vertical-align: top }
th { color: var(--muted); font-weight: 500; white-space: nowrap }
td.num, th.num { text-align: right }
.tablewrap { overflow-x: auto }
.st { font-size: 12px; border-radius: 4px; padding: 0 5px; white-space: nowrap; border: 1px solid var(--rule) }
.st.same { color: var(--muted) }
.st.altered, .st.replaced, .st.vanished { color: #fff; background: var(--red); border-color: var(--red) }
.st.altered { background: color-mix(in srgb, var(--red) 70%, var(--surface)) }
.st.exited, .st.hidden { color: var(--ink2); background: var(--surface2) }
.res { font-size: 12px; border-radius: 4px; padding: 0 6px; white-space: nowrap }
.res.win { background: color-mix(in srgb, var(--green) 22%, transparent); color: var(--ink) }
.res.lose { background: color-mix(in srgb, var(--red) 22%, transparent); color: var(--ink) }
.res.same, .res.both_bad { background: var(--surface2); color: var(--ink2) }
.ev { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--rule2) }
.ev:last-child { border-bottom: 0 }
.ev .sev { font: 600 11px var(--f-data); border-radius: 4px; padding: 1px 6px; color: #fff; height: fit-content }
.ev .eh { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline }
.note { color: var(--ink2); font-size: 13px }
.cmpgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; padding-top: 12px }
@media (max-width: 480px) { .cmpgrid { grid-template-columns: 1fr } input[type=search] { width: 100% } }
.cmpcard { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px; display: grid; gap: 8px; min-width: 0 }
.cmpcard .hd { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap }
.prose { max-width: 78ch; color: var(--ink2) } .prose p { margin: 0 0 10px } .prose strong { color: var(--ink) }
.chart { position: relative }
.chart svg text { font-family: var(--f-body); fill: var(--muted); font-size: 11px }
.chart svg text.lab { fill: var(--ink2); font-size: 12px }
.hint { font-size: 12.5px; color: var(--muted) }
.empty { padding: 40px; text-align: center; color: var(--muted) }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>长视频问题浏览器</h1>
  <nav class="tabs" aria-label="视图">
    <a href="#browse" data-v="browse">浏览</a>
    <a href="#cmp" data-v="cmp">同一 prompt 对比</a>
    <a href="#sum" data-v="sum">方法汇总</a>
    <a href="#about" data-v="about">说明</a>
  </nav>
  <span class="spacer"></span>
  <button class="btn" id="theme" title="切换明暗">明暗：自动</button>
</div></header>

<div class="wrap">
  <section class="view" id="view-browse">
    <div class="filters" id="filters"></div>
    <div class="legend" id="legend1"></div>
    <div class="grid" id="grid"></div>
    <div class="more"><button class="btn" id="moreBtn">加载更多</button></div>
  </section>
  <section class="view" id="view-detail"></section>
  <section class="view" id="view-cmp"></section>
  <section class="view" id="view-sum"></section>
  <section class="view" id="view-about"></section>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<!-- shared SVG defs; must stay rendered (not display:none) for url(#hatch) to resolve -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="5" fill="var(--violet)"/></pattern>
</defs></svg>

<script>
"use strict";
// ---------- vocab ----------
const ARMS = ["R", "AB10", "ABs10", "ll_orig", "ll_opsdv", "sf_orig", "sf_opsdv"];
const M = {
  R:        { s: "LL·R",              n: "LongLive-1.3B · R（我们的推理代码，普通读取）", c: "var(--m1)" },
  AB10:     { s: "LL·AB10",           n: "LongLive-1.3B · AB10（对齐 sink 偏置，主体位置来自 SAM 2）", c: "var(--m2)" },
  ABs10:    { s: "LL·ABs10",          n: "LongLive-1.3B · ABs10（AB10 的无外部模型版本）", c: "var(--m3)" },
  ll_orig:  { s: "LongLive",          n: "LongLive-1.3B 官方权重 · OPSD-V 仓库推理", c: "var(--m4)" },
  ll_opsdv: { s: "LongLive+OPSD-V",   n: "LongLive-1.3B + OPSD-V LoRA", c: "var(--m5)" },
  sf_orig:  { s: "Self-Forcing",      n: "Self-Forcing（DMD，5 s 训练，推到 60 s）", c: "var(--m6)" },
  sf_opsdv: { s: "Self-Forcing+OPSD-V", n: "Self-Forcing + OPSD-V LoRA", c: "var(--m7)" },
};
const DS = {
  mg128_2seeds_60s:    { s: "MG128", n: "MovieGen 前 128 条 prompt × 2 个种子（LL·R / AB10 / ABs10）" },
  mgx100_seed5000_60s: { s: "MGX100", n: "MovieGen 抽 100 条 prompt，seed 5000+（Self-Forcing / LongLive ± OPSD-V）" },
};
const TN = { identity_drift: "身份漂移", attribute_drift: "属性漂移", object_permanence: "物体凭空出现/消失/重复",
  scene_drift: "场景漂移", scene_cut: "突然切镜", quality_degradation: "画质退化", structure_artifact: "结构畸变",
  loop_repetition: "循环 / 原地踏步", motion_stall: "运动停滞", prompt_drift: "偏离提示词", other: "其他" };
const FAM = { identity_drift: "subj", attribute_drift: "subj", object_permanence: "subj", scene_drift: "scene", scene_cut: "scene",
  quality_degradation: "qual", structure_artifact: "qual", loop_repetition: "motion", motion_stall: "motion", prompt_drift: "other", other: "other" };
const FN = { subj: "主体（身份 / 属性 / 物体恒存）", scene: "场景 / 背景", qual: "画质 / 结构", motion: "运动（循环 / 停滞）", other: "偏离提示词 / 其他" };
const FC = { subj: "var(--red)", scene: "var(--blue)", qual: "var(--orange)", motion: "var(--violet)", other: "var(--gray)" };
const KIND = { altered: "被改变", replaced: "被替换", vanished: "消失", none: "无" };
const ST = { same: "不变", altered: "改变", replaced: "被替换", vanished: "消失", exited: "出画", hidden: "被遮挡" };
const FROZ = { none: "无", partial: "部分冻结", mostly: "大部分冻结" };
const DEG = { stable: "稳定", gradual: "逐渐衰退", collapse: "崩坏" };
const ART = { none: "无", minor: "轻微", major: "严重" };
const CMP = { r_ab10: "LL·R 对 LL·AB10", abs_ab10: "LL·AB10 对 LL·ABs10", ll_opsdv: "LongLive 对 LongLive+OPSD-V", sf_opsdv: "Self-Forcing 对 Self-Forcing+OPSD-V" };
const Q = { identity: "身份", motion: "运动", quality: "画质", prompt: "提示词", overall: "总体" };
const RES = { win: "胜", lose: "负", same: "相同", both_bad: "都差" };
const VBN = { subject_consistency: "主体一致", background_consistency: "背景一致", motion_smoothness: "运动平滑", dynamic_degree: "动态程度", imaging_quality: "成像质量" };

// ---------- dom helpers (all label text goes through textContent) ----------
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "text") e.textContent = v; else if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (k === "style") e.style.cssText = v; else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
function sv(tag, attrs, ...kids) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) e.setAttribute(k, v);
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const $ = s => document.querySelector(s);
const isNum = x => typeof x === "number" && isFinite(x);
const pct = x => (100 * x).toFixed(0) + "%";
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : NaN;
const median = a => { if (!a.length) return NaN; const b = [...a].sort((x, y) => x - y); return b[b.length >> 1]; };
const mchip = arm => el("span", { class: "mchip" }, el("span", { class: "sw", style: `background:${M[arm].c}` }), M[arm].s);
const SW = 96, SH = 55;
function frameBg(node, id, s, scale = 1) {
  node.style.backgroundImage = `url(s/${id}.webp)`;
  node.style.backgroundSize = `${61 * 100}% 100%`;
  node.style.backgroundPosition = `${(s / 60) * 100}% 0`;
}

// ---------- data ----------
let D = [], BYID = {}, GROUPS = [], GROUP_OF = {};
function derive(v) {
  v.dT = v.whole.map(w => isNum(w.drift_t) ? w.drift_t : null);
  const any = f => v.whole.some(f), both = f => v.whole.length > 0 && v.whole.every(f);
  const F = {
    drift: w => isNum(w.drift_t), degrade: w => w.degrade !== "stable", collapse: w => w.degrade === "collapse",
    frozen: w => w.frozen !== "none", loop: w => w.loop === "yes", major: w => w.artifact === "major",
  };
  v.any = {}; v.both = {};
  for (const [k, f] of Object.entries(F)) { v.any[k] = any(f); v.both[k] = both(f); }
  const pd = [1, 2].map(p => v.probe.filter(x => x.pass_ === p).some(x => x.main_drift));
  v.any.probe = pd[0] || pd[1]; v.both.probe = v.probe.length > 0 && pd[0] && pd[1];
  const ev = v.events ? v.events.events : [];
  v.any.s3 = v.both.s3 = ev.some(e => e.sev === 3);
  v.any.subj = v.both.subj = ev.some(e => FAM[e.type] === "subj" && e.sev >= 2);
  v.any.clean = !v.any.drift && !v.any.degrade && !v.any.frozen; v.both.clean = !v.both.drift && !v.both.degrade && !v.both.frozen;
  const ts = v.dT.filter(isNum); v.driftMin = ts.length ? Math.min(...ts) : 99;
  v.sevSum = ev.reduce((s, e) => s + (e.sev || 0) ** 2, 0);
  v.unit = v.dataset === "mg128_2seeds_60s" ? `#${v.line} · seed ${v.seed}` : `#${v.pos} · seed ${v.seed}`;
}
function buildGroups() {
  const m = new Map();
  for (const v of D) { if (!m.has(v.prompt)) m.set(v.prompt, []); m.get(v.prompt).push(v); }
  GROUPS = [...m.entries()].map(([p, vs]) => ({ prompt: p, vs: vs.sort((a, b) => a.dataset.localeCompare(b.dataset) || a.seed - b.seed || ARMS.indexOf(a.arm) - ARMS.indexOf(b.arm)) }));
  GROUPS.sort((a, b) => a.vs[0].dataset.localeCompare(b.vs[0].dataset) || (a.vs[0].line ?? a.vs[0].pos) - (b.vs[0].line ?? b.vs[0].pos));
  GROUPS.forEach((g, i) => g.vs.forEach(v => GROUP_OF[v.id] = i));
}

// ---------- tooltip ----------
const tip = $("#tip");
function showTip(evt, build) {
  tip.replaceChildren(...build());
  tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let x = evt.clientX + 14, y = evt.clientY + 14;
  if (x + r.width > innerWidth - 8) x = evt.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = evt.clientY - r.height - 14;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => { tip.style.display = "none"; };

// ---------- timeline ----------
function packRows(evs) {
  const rows = [];
  for (const e of [...evs].sort((a, b) => a.t0 - b.t0)) {
    const t1 = e.t1 ?? 60;
    let r = rows.findIndex(end => end <= e.t0 - 0.5);
    if (r < 0) { r = rows.length; rows.push(0); }
    rows[r] = Math.max(t1, e.t0 + 1); e._row = r;
  }
  return Math.max(1, rows.length);
}
function activeAt(v, t) {
  const out = [];
  if (v.events) for (const e of v.events.events) if (e.t0 <= t + 0.5 && t <= (e.t1 ?? 60) + 0.5)
    out.push({ c: FC[FAM[e.type] || "other"], txt: `逐事件 · ${TN[e.type] || e.type} · S${e.sev}${e.entity_zh || e.entity ? " · " + (e.entity_zh || e.entity) : ""}` });
  v.whole.forEach(w => {
    if (isNum(w.drift_t) && t >= w.drift_t) out.push({ c: "var(--red)", txt: `整段第${w.pass_}轮 · 主体${KIND[w.drift_kind] || "漂移"}（自 ${w.drift_t} s）` });
    if (w.degrade !== "stable" && isNum(w.degrade_t) && t >= w.degrade_t) out.push({ c: "var(--orange)", txt: `整段第${w.pass_}轮 · 画质${DEG[w.degrade]}（自 ${w.degrade_t} s）` });
  });

}

// ---------- router ----------
function route() {
  const h = location.hash.slice(1) || "browse";
  const [v, arg] = h.split("/");
  const view = { browse: "browse", v: "detail", cmp: "cmp", sum: "sum", about: "about" }[v] || "browse";
  document.querySelectorAll("section.view").forEach(s => s.classList.toggle("on", s.id === "view-" + view));
  document.querySelectorAll("nav.tabs a").forEach(a => a.classList.toggle("on", a.dataset.v === (view === "detail" ? "browse" : view)));
  document.querySelectorAll("video").forEach(x => { if (!x.closest("section.view.on")) x.pause(); });
  hideTip();
  if (view === "detail") { detail(decodeURIComponent(arg || "")); scrollTo(0, 0); }
  else if (view === "cmp") { compare(parseInt(arg ?? "0", 10)); scrollTo(0, 0); }
  else if (view === "sum") summary();
  else if (view === "about") about();
}
let RT; addEventListener("resize", () => { clearTimeout(RT); RT = setTimeout(() => {
  if ($("#view-detail").classList.contains("on") && CUR) CUR.drawTl();
  if ($("#view-cmp").classList.contains("on") && CMPV) CMPV.draw(); }, 150); });
addEventListener("hashchange", route);

// ---------- theme ----------
(() => {
  const b = $("#theme"), names = { auto: "自动", light: "亮", dark: "暗" }, order = ["auto", "light", "dark"];
  let m = "auto"; try { m = localStorage.getItem("lhg-theme") || "auto"; } catch (e) {}
  const apply = () => { if (m === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", m); b.textContent = "明暗：" + names[m]; };
  b.addEventListener("click", () => { m = order[(order.indexOf(m) + 1) % 3]; try { localStorage.setItem("lhg-theme", m); } catch (e) {} apply(); });
  apply();
})();

fetch("data.json").then(r => r.json()).then(d => {
  D = d.videos; D.forEach(derive); D.forEach(v => BYID[v.id] = v); buildGroups();
  buildFilters(); legend($("#legend1"), false); refresh(); route();
}).catch(e => { document.querySelector(".wrap").prepend(el("div", { class: "empty", text: "data.json 加载失败：" + e })); });
</script>
</body>
